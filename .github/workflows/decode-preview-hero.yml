name: Build preview hero image
on:
  push:
    paths:
      - "preview/assets/hero-upload.b64"
      - ".github/workflows/decode-preview-hero.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode hero image
        run: base64 -d preview/assets/hero-upload.b64 > preview/assets/hero-samuel-frutas.jpg
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/hero-samuel-frutas.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix preview hero image quality"
          git push
