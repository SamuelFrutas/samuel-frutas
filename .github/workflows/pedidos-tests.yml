name: Testes do Sistema de Pedidos

on:
  push:
    branches: [migracao-pedidos-pages]
  workflow_dispatch:

jobs:
  test-pedidos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar sintaxe JavaScript
        run: |
          node --check pedidos/app.js
          node --check pedidos/admin.js
          node --check pedidos/order-engine.js
      - name: Testar motor de pedidos
        run: node --experimental-default-type=module pedidos/order-engine.test.mjs
      - name: Conferir isolamento do Sistema de Agendamentos
        run: |
          ! grep -R -F "../firebase.js" pedidos --include='*.js' --include='*.html'
          ! grep -R -F "/api/" pedidos --include='*.js' --include='*.html'
          ! grep -R -E "collection.*produtos|collection\(db, 'produtos'\)" pedidos --include='*.js'
