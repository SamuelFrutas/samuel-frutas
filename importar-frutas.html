<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importar frutas - Samuel Frutas</title>
<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import { collection, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

const frutas = [
  'Banana','Mamão Papaya','Uva verde','Uva preta','Pera macia','Melão','Melancia','Manga Palmer','Abacaxi','Limão','Laranja pera','Maçã','Mexeriquinha','Tangerina Pocã','Morango','Tâmara','Mirtilo','Banana d\'água','Maracujá','Kiwi','Caju','Goiaba vermelha'
];

const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

// A imagem é gerada por busca do nome da fruta; não altera nenhum outro campo do produto.
const imageUrl = name => `https://loremflickr.com/800/800/${encodeURIComponent(name.toLowerCase())},fruit/all`;

function build(name) {
  return {
    nome: name,
    categoria: 'frutas',
    ativo: true,
    imagemUrl: imageUrl(name),
    unidadesMedida: {
      unidade: true,
      quilo: false,
      duzia: false,
      maco: false,
      bandeja: false,
      litro: false,
      garrafa: false,
      lote: false
    },
    formasVenda: [
      { tipo: 'unidade', quantidade: 1, preco: 0 }
    ],
    criadoEm: new Date().toISOString()
  };
}

window.addEventListener('DOMContentLoaded', () => {
  const status = document.getElementById('status');
  const btn = document.getElementById('importar');
  onAuthStateChanged(auth, user => {
    if (!user) {
      status.textContent = 'Faça login no painel administrativo antes de importar.';
      btn.disabled = true;
      return;
    }
    btn.disabled = false;
    btn.onclick = async () => {
      btn.disabled = true;
      let ok = 0;
      for (const nome of frutas) {
        try {
          await setDoc(doc(collection(db, 'produtos'), slug(nome)), build(nome), { merge: true });
          ok++;
          status.textContent = `Cadastrando ${ok}/${frutas.length}: ${nome}`;
        } catch (e) {
          status.textContent = `ERRO em ${nome}: ${e.message}`;
          btn.disabled = false;
          return;
        }
      }
      status.textContent = `Concluído: ${ok}/${frutas.length} frutas gravadas.`;
      btn.disabled = false;
    };
  });
});
</script>
<style>body{font-family:Arial,sans-serif;background:#f5f7f5;padding:24px;color:#263238}main{max-width:650px;margin:40px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 18px #0001}button{width:100%;padding:16px;border:0;border-radius:12px;background:#198754;color:#fff;font-size:17px;font-weight:700}button:disabled{opacity:.5}.status{margin-top:16px;padding:14px;border-radius:10px;background:#f1f3f4}</style>
</head>
<body><main><h2>🍎 Importação de frutas</h2><p>Importa as 22 frutas como categoria <strong>Frutas</strong>, usando somente a unidade UN.</p><button id="importar" disabled>Importar 22 frutas</button><div id="status" class="status">Verificando autenticação...</div></main></body>
</html>
