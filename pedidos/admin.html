<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samuel Frutas — Cadastro de Produtos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f5;color:#182230}.wrap{max-width:1100px;margin:auto;padding:16px}.box{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid #e5e7eb}.login{max-width:420px;margin:8vh auto}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{height:46px;border:1px solid #d0d5dd;border-radius:9px;padding:0 12px;font:inherit;width:100%}.btn{border:0;border-radius:9px;padding:11px 15px;background:#0f8a4b;color:#fff;font-weight:700;cursor:pointer;min-height:44px}.btn.sec{background:#fff;color:#344054;border:1px solid #d0d5dd}.btn.danger{background:#fff1f0;color:#b42318;border:1px solid #fecaca}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.tabs{display:flex;gap:8px;margin-bottom:12px}.product{border:1px solid #e5e7eb;border-radius:13px;padding:13px;margin:9px 0;background:#f8faf9}.product-head{display:flex;gap:12px;align-items:center}.thumb{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#eee}.image-preview{display:none;width:180px;height:180px;object-fit:cover;border-radius:12px;border:1px solid #d0d5dd;background:#f8fafc}.preview-note{font-size:13px;color:#667085}.name{font-weight:800;font-size:17px}.muted{color:#667085;font-size:13px}.measure{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:8px 0}.measure input{height:42px;border:1px solid #d0d5dd;border-radius:8px;padding:0 9px}@media(max-width:650px){.wrap{padding:9px}.measure{grid-template-columns:1fr 1fr}.measure button{grid-column:1/-1}.actions>*{flex:1}.tabs{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login" class="box login">
<h1>Samuel Frutas</h1><p class="muted">Cadastro administrativo de produtos</p>
<div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div>
<div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="btn" id="loginBtn">Entrar</button><p id="loginMsg" class="muted"></p>
</div>
<div id="app" class="hidden"><div class="wrap">
<header class="box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h1 style="margin:0">Cadastro de Produtos</h1><span id="user" class="muted"></span></div><div class="actions"><a class="btn sec" href="./index.html">Abrir loja</a><button class="btn sec" id="logout">Sair</button></div></div></header>
<section class="box"><div class="tabs"><button class="btn" id="activeTab">Ativos</button><button class="btn sec" id="archivedTab">Arquivados</button></div><div class="actions"><button class="btn" id="newProduct">+ Adicionar produto</button><button class="btn sec" id="reload">Atualizar</button></div><div id="form" class="hidden"><h2 id="formTitle">Novo produto</h2><div class="field"><label>Nome</label><input id="name"></div><div class="field"><label>Imagem (URL)</label><input id="image" placeholder="https://..."></div><div class="field"><label>Pré-visualização</label><img id="imagePreview" class="image-preview" alt="Pré-visualização da imagem"><span id="imagePreviewNote" class="preview-note">Cole a URL da imagem para visualizar antes de salvar.</span></div><div id="measures"></div><div class="actions"><button class="btn sec" id="addMeasure">+ Medida</button><button class="btn" id="save">Salvar</button><button class="btn sec" id="cancel">Cancelar</button></div></div><div id="products"></div></section>
</div></div>
<script type="module" src="./admin.js"></script>
</body></html>
