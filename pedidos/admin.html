<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220">
<title>Samuel Frutas — Cadastro de produtos</title>
<style>
:root{--bg:#07101c;--panel:#101b2b;--panel2:#152238;--line:#26364d;--text:#f5f7fb;--muted:#94a3b8;--green:#22c55e;--green2:#16a34a;--red:#ef4444;--blue:#3b82f6;--shadow:0 16px 40px rgba(0,0,0,.25)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12233c 0,#07101c 45%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}.wrap{width:min(1100px,100%);margin:auto;padding:14px}.box{background:rgba(16,27,43,.94);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}.login{max-width:430px;margin:9vh auto}.login h1{margin:0 0 5px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;font-weight:700;color:#cbd5e1}.field input,.field select{height:46px;width:100%;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#0b1626;color:var(--text);outline:0}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.12)}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--green2);color:white;font-weight:800;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn:hover{filter:brightness(1.08)}.btn.sec{background:#17243a;color:#dbe5f1;border:1px solid var(--line)}.btn.danger{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.tabs{display:flex;gap:8px;margin-bottom:12px}.product{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:linear-gradient(145deg,#122035,#0d1828)}.product-head{display:flex;gap:12px;align-items:center}.thumb{width:64px;height:64px;border-radius:13px;object-fit:cover;background:#0a1422;border:1px solid var(--line)}.name{font-weight:850;font-size:17px}.muted{color:var(--muted);font-size:13px}.measure{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:9px 0}.measure input,.measure select{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 9px;background:#0b1626;color:var(--text);min-width:0}.status{padding:11px;border-radius:12px;background:rgba(34,197,94,.08);color:#bbf7d0}.error{background:#3a2810;color:#fde68a}@media(max-width:650px){body{background:#07101c}.wrap{padding:9px}.box{padding:14px;border-radius:17px}.measure{grid-template-columns:1fr 1fr}.measure button{grid-column:1/-1}.actions>*{flex:1}.tabs{display:grid;grid-template-columns:1fr 1fr}.product-head{align-items:flex-start}}
</style>
</head>
<body>
<div id="login" class="box login">
<h1>🍎 Samuel Frutas</h1><p class="muted">Cadastro e edição de produtos</p>
<div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div>
<div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="btn" id="loginBtn">Entrar no painel</button><p id="loginMsg" class="muted"></p>
</div>
<div id="app" class="hidden"><div class="wrap">
<header class="box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><div style="font-size:12px;color:#86efac;font-weight:800;letter-spacing:.08em;text-transform:uppercase">Samuel Frutas</div><h1 style="margin:4px 0 3px">Produtos</h1><span id="user" class="muted"></span></div><div class="actions"><a class="btn sec" href="./index.html">🛒 Loja</a><button class="btn sec" id="logout">Sair</button></div></div></header>
<section class="box"><div class="tabs"><button class="btn" id="activeTab">Ativos</button><button class="btn sec" id="archivedTab">Arquivados</button></div><div class="actions"><button class="btn" id="newProduct">＋ Adicionar produto</button><button class="btn sec" id="reload">↻ Atualizar</button></div>
<div id="form" class="hidden" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line)"><h2 id="formTitle" style="margin:0 0 12px">Novo produto</h2><div class="field"><label>Nome</label><input id="name"></div><div class="field"><label>Imagem (URL)</label><input id="image" placeholder="https://..."></div><div id="measures"></div><div class="actions"><button class="btn sec" id="addMeasure">＋ Medida</button><button class="btn" id="save">Salvar</button><button class="btn sec" id="cancel">Cancelar</button></div></div>
<div id="products" style="margin-top:14px"></div></section>
<section class="box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">Pedidos recentes</h2><span class="muted">Últimos pedidos recebidos</span></div><button class="btn sec" id="reloadOrders">↻ Atualizar</button></div><div id="orders" style="margin-top:12px"><p class="muted">Carregando...</p></div></section>
</div></div>
<script type="module" src="./admin.js"></script>
</body></html>
