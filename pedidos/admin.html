<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samuel Frutas — Painel de Pedidos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f5;color:#182230}.wrap{max-width:1100px;margin:auto;padding:16px}.box{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid #e5e7eb;box-shadow:0 2px 10px rgba(16,24,40,.03)}.login{max-width:420px;margin:8vh auto}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{height:46px;border:1px solid #d0d5dd;border-radius:10px;padding:0 12px;font:inherit;width:100%;background:#fff;color:#182230;transition:border-color .15s,box-shadow .15s}.field input:focus,.field select:focus,.measure input:focus,.measure select:focus{outline:0;border-color:#0f8a4b;box-shadow:0 0 0 3px rgba(15,138,75,.10)}.btn{border:0;border-radius:9px;padding:11px 15px;background:#0f8a4b;color:#fff;font-weight:700;cursor:pointer;min-height:44px}.btn.sec{background:#fff;color:#344054;border:1px solid #d0d5dd}.btn.danger{background:#fff1f0;color:#b42318;border:1px solid #fecaca}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.tabs{display:flex;gap:8px;margin-bottom:12px}.product{border:1px solid #e5e7eb;border-radius:13px;padding:13px;margin:9px 0;background:#f8faf9}.product-head{display:flex;gap:12px;align-items:center}.thumb{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#eee}.name{font-weight:800;font-size:17px}.muted{color:#667085;font-size:13px}.measure-section{margin:16px 0 12px;padding:14px;border:1px solid #e6ebe8;border-radius:14px;background:#fbfdfc}.measure-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.measure-section-title{font-size:14px;font-weight:800;color:#182230}.measure-section-help{font-size:12px;color:#667085;margin-top:3px}.measure{display:grid;grid-template-columns:minmax(100px,1fr) minmax(120px,1.1fr) minmax(120px,1fr) 42px;gap:9px;align-items:end;margin:9px 0;padding:10px;border:1px solid #e3e8e5;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.04)}.measure-field{display:grid;gap:5px;min-width:0}.measure-label{font-size:11px;font-weight:700;color:#667085}.measure input,.measure select{height:42px;border:1px solid #d0d5dd;border-radius:9px;padding:0 10px;font:inherit;width:100%;background:#fff;color:#182230;transition:border-color .15s,box-shadow .15s}.measure select{font-weight:700}.measure .remove{width:42px;min-width:42px;height:42px;min-height:42px;padding:0;border-radius:10px;font-size:20px;line-height:1}.measure-add{white-space:nowrap}.status{padding:10px;border-radius:10px;background:#f0fdf4}.error{background:#fff3cd;color:#664d03}.image-preview-wrap{display:block;margin-top:10px;padding:12px;border:1px solid #d0d5dd;border-radius:12px;background:#f8faf9}.image-preview-wrap.hidden{display:none}.image-preview-label{display:block;margin-bottom:8px;font-size:13px;color:#667085;font-weight:700}.image-preview{display:block;width:180px;height:180px;border-radius:12px;object-fit:cover;border:1px solid #d0d5dd;background:#fff}.image-preview-status{display:block;margin-top:8px;font-size:12px;color:#667085}.image-preview-wrap.has-error{border-color:#fda29b;background:#fff7f7}.image-preview-wrap.has-error .image-preview-status{color:#b42318}.order{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}.order ul{margin:8px 0;padding-left:20px}@media(max-width:650px){.wrap{padding:9px}.measure-section{padding:11px}.measure-section-head{align-items:flex-start;flex-direction:column}.measure{grid-template-columns:1fr 1fr;padding:10px}.measure-field:nth-child(3){grid-column:1/-1}.measure .remove{grid-column:1/-1;width:100%}.measure-add{width:100%}.actions>*{flex:1}.tabs{display:grid;grid-template-columns:1fr 1fr}.image-preview{width:140px;height:140px}}
</style>
</head>
<body>
<div id="login" class="box login">
<h1>Samuel Frutas</h1><p class="muted">Painel administrativo do Sistema de Pedidos</p>
<div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div>
<div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="btn" id="loginBtn">Entrar</button><p id="loginMsg" class="muted"></p>
</div>
<div id="app" class="hidden"><div class="wrap">
<header class="box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h1 style="margin:0">Painel de Pedidos</h1><span id="user" class="muted"></span></div><div class="actions"><a class="btn sec" href="./index.html">Abrir loja</a><button class="btn sec" id="logout">Sair</button></div></div></header>
<section class="box"><div class="tabs"><button class="btn" id="activeTab">Ativos</button><button class="btn sec" id="archivedTab">Arquivados</button></div><div class="actions"><button class="btn" id="newProduct">+ Adicionar produto</button><button class="btn sec" id="reload">Atualizar</button></div><div id="form" class="hidden"><h2 id="formTitle">Novo produto</h2><div class="field"><label>Nome</label><input id="name"></div><div class="field"><label>Imagem (URL)</label><input id="image" placeholder="Cole aqui a URL direta da imagem"><div id="imagePreviewWrap" class="image-preview-wrap hidden"><span class="image-preview-label">Pré-visualização da imagem</span><img id="imagePreview" class="image-preview" alt="Pré-visualização da imagem"><span id="imagePreviewStatus" class="image-preview-status">Cole a URL da imagem acima para visualizar.</span></div></div><div id="measures" class="measure-section"><div class="measure-section-head"><div><div class="measure-section-title">Medidas e preços</div><div class="measure-section-help">Cadastre as opções que o cliente poderá escolher na loja.</div></div><button class="btn sec measure-add" id="addMeasure">+ Adicionar medida</button></div><div id="measureRows"></div></div><div class="actions"><button class="btn" id="save">Salvar</button><button class="btn sec" id="cancel">Cancelar</button></div></div><div id="products"></div></section>
<section class="box"><h2>Pedidos recentes</h2><div class="actions"><button class="btn sec" id="reloadOrders">Atualizar pedidos</button></div><div id="orders"><p class="muted">Carregando...</p></div></section>
</div></div>
<script type="module" src="./admin.js?v=modern3"></script>
</body></html>
