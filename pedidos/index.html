<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8a4b"><title>Samuel Frutas — Fazer pedido</title><link rel="stylesheet" href="./style.css"></head><body><main class="wrap"><header class="head"><h1>Samuel Frutas</h1><p>Escolha os produtos e monte seu pedido.</p></header><input id="search" class="search" placeholder="Buscar produto..."><p class="cart-note">A quantidade só entra na sacola quando você adicionar o produto.</p><div id="products">Carregando...</div></main><div class="floating"><button id="finish" class="finish" onclick="openReview()">Finalizar pedido</button></div><div id="modal" class="modal"><div class="sheet"><div class="sheet-head"><h2>Sua sacola</h2><button class="close small" onclick="closeReview()">Fechar</button></div><div id="review"></div><div id="reviewSummary" class="review-summary" style="display:none"></div><div class="review-total"><span>Total</span><b id="reviewTotal">R$ 0,00</b></div><div class="delivery-rules">Abaixo de R$ 20: R$ 5 de taxa · R$ 20 até R$ 50: R$ 3 · R$ 50 ou mais: grátis</div><button id="sendButton" class="send" onclick="sendOrder()">Enviar pedido pelo WhatsApp</button><div id="result"></div></div></div><div id="obsModal" class="modal obs-modal"><div class="obs-box"><h3>Adicionar observação</h3><p id="obsProductName">Para este produto</p><textarea id="obsInput" class="obs-input" maxlength="300" placeholder="Ex.: escolher mais maduro, sem muito verde..."></textarea><div class="obs-actions"><button class="obs-cancel" onclick="closeObservation()">Cancelar</button><button class="obs-save" onclick="saveObservation()">Salvar observação</button></div></div></div><script type="module" src="./order-closed.js"></script><script type="module" src="./app.js"></script></body></html>
