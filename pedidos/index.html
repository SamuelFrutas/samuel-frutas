<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8a4b"><title>Samuel Frutas — Fazer pedido</title><style>:root{--g:#0f8a4b;--bg:#f5f7f6;--text:#182230;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:12px 10px 100px}.head,.product{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px}.head{background:linear-gradient(135deg,#fff,#f0f8f3)}h1{margin:0;font-size:25px}.muted{color:var(--muted)}.search{width:100%;height:48px;border:1px solid #d0d5dd;border-radius:13px;padding:0 14px;margin-bottom:10px;font-size:16px}.product-top{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}.photo{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#eee}.name{font-weight:800;font-size:18px}.measures{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.measure{padding:9px 12px;border:1px solid #d8dfdb;border-radius:11px;background:#fff;font-weight:700}.measure.active{background:#e9f6ef;border-color:var(--g);color:#08763e}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.counter{display:flex;align-items:center;gap:9px}.counter button{width:40px;height:40px;border:0;border-radius:10px;background:var(--g);color:#fff;font-size:22px}.counter span{min-width:25px;text-align:center;font-weight:800}.price{color:var(--g);font-weight:800}.floating{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(800px,calc(100% - 20px))}.finish{width:100%;height:54px;border:0;border-radius:15px;background:var(--g);color:#fff;font-size:17px;font-weight:800}.empty{text-align:center;padding:35px;color:var(--muted)}.status{padding:12px;border-radius:12px;background:#fff3cd;color:#664d03;margin-bottom:10px}</style></head><body><main class="wrap"><header class="head"><h1>Samuel Frutas</h1><p class="muted">Escolha os produtos e monte seu pedido.</p></header><div id="status" class="status">Carregando produtos...</div><input id="search" class="search" placeholder="Buscar produto..."><div id="products"></div></main><div class="floating"><button class="finish" id="finish">Finalizar pedido</button></div><script type="module">import{loadCatalog,selectedTotal,deliveryFee,saveOrder}from'./order-data.js';let products=[];const cart={};const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=$('search').value.trim().toLowerCase(),list=products.filter(p=>!q||String(p.name||'').toLowerCase().includes(q));$('products').innerHTML=list.length?list.map(p=>{const ms=Array.isArray(p.measures)?p.measures.filter(m=>Number(m?.price||0)>0):[],c=cart[p.id]||{measureIndex:0,quantity:0},m=ms[c.measureIndex]||ms[0];return`<article class="product"><div class="product-top"><img class="photo" src="${p.image||''}" onerror="this.style.visibility='hidden'"><div><div class="name">${esc(p.name||'')}</div><div class="muted">Escolha a unidade</div></div></div><div class="measures">${ms.map((x,i)=>`<button class="measure ${i===c.measureIndex?'active':''}" data-id="${p.id}" data-i="${i}">${esc(x.unit||'Un')}</button>`).join('')}</div><div class="row"><span class="price">${money(m?.price)}</span><div class="counter"><button data-change="-1" data-id="${p.id}">−</button><span>${c.quantity||0}</span><button data-change="1" data-id="${p.id}">+</button></div></div>${c.quantity?`<div class="row"><span class="muted">Total deste produto</span><strong class="price">${money(selectedTotal(p,c))}</strong></div>`:''}</article>`}).join(''):'<div class="empty">Nenhum produto encontrado.</div>'}$('products').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;if(!id)return;const c=cart[id]||{measureIndex:0,quantity:0};if(b.dataset.i!==undefined)c.measureIndex=Number(b.dataset.i);if(b.dataset.change)c.quantity=Math.max(0,c.quantity+Number(b.dataset.change));cart[id]=c;render()});$('search').addEventListener('input',render);$('finish').addEventListener('click',async()=>{const items=[];let subtotal=0;for(const[id,c]of Object.entries(cart)){if(!c.quantity)continue;const p=products.find(x=>x.id===id);if(!p)continue;const m=(p.measures||[])[c.measureIndex]||(p.measures||[])[0],value=selectedTotal(p,c);subtotal+=value;items.push({productId:id,name:p.name,unit:m?.unit||'Un',measureQuantity:Number(m?.quantity||m?.lotSize||1),quantity:c.quantity,value})}if(!items.length)return alert('A sacola está vazia.');const fee=deliveryFee(subtotal),total=subtotal+fee;try{const orderId=await saveOrder({items,subtotal,deliveryFee:fee,total});alert(`Pedido registrado: ${orderId}\nTotal: ${money(total)}`)}catch(e){alert(e.message||'Não foi possível registrar o pedido.')}});try{products=await loadCatalog();$('status').style.display='none';render()}catch(e){$('status').textContent=e.message||'Não foi possível carregar o catálogo.'}</script></body></html>
