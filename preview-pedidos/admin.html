<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samuel Frutas — Produtos</title><link rel="stylesheet" href="./admin.css"></head><body class="admin-page"><header><div><strong>Samuel Frutas</strong><small>Painel de produtos</small></div><div class="head-actions"><a href="./index.html">← Loja</a><button id="logout">Sair</button></div></header><main><section class="hero"><span>⚙️ Administração</span><h1>Produtos</h1><p>Cadastre e organize os produtos que aparecem na loja.</p></section><div class="toolbar"><input id="search" placeholder="🔎 Buscar produto"><button id="new">＋ Novo produto</button></div><section id="list" class="list"></section></main><div id="modal" class="modal"><div class="sheet"><div class="sheet-head"><div><strong id="modalTitle">Novo produto</strong><small>Cadastro do produto</small></div><button id="close">✕</button></div><form id="productForm"><label>Nome<input id="name" required></label><label>Categoria<select id="category"><option>Frutas</option><option>Legumes</option><option>Verduras</option><option>Água de coco e ovos caipira</option></select></label><label>Imagem (URL)<input id="imageUrl" placeholder="https://..."></label><div class="measure-head"><strong>Unidades e preços</strong><button type="button" id="addMeasure">＋ Adicionar medida</button></div><div id="measures"></div><label class="check"><input id="active" type="checkbox" checked> Produto ativo na loja</label><div class="modal-actions"><button type="button" id="cancel" class="view">Cancelar</button><button class="primary" type="submit">Salvar produto</button></div><div id="error" class="error"></div></form></div></div><script type="module" src="./admin.js"></script></body></html>
