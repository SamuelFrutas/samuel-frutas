<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6b3a"><title>Samuel Frutas</title><link rel="stylesheet" href="./preview.css?v=10"></head><body>
<header class="top"><button id="home" class="brand"><span class="logo">🍃</span><span><b>Samuel Frutas</b><small>Fresquinho para você</small></span></button><button id="bag" class="bag">🛒<i id="count">0</i></button></header>
<main>
<section id="catalog" class="view on">
<div class="hero"><div><span>PEDIDO ONLINE</span><h1>Qualidade e frescor<br>sempre perto de você!</h1><p>Frutas, legumes e verduras selecionados todos os dias.</p></div><div class="hero-orb">🍊</div></div>
<label class="search">⌕<input id="search" type="search" placeholder="Buscar frutas, verduras..."></label>
<div id="cats" class="cats"></div>
<section id="products"></section>
</section>
<section id="cart" class="view"><div class="head"><button id="back">←</button><div><small>SUA SACOLA</small><h2>Minha Sacola</h2></div></div><div id="cartlist"></div>
<div class="checkout"><div class="checkout-head">🚚<div><h3>Tipo de pedido</h3><p>Escolha como deseja receber.</p></div></div><div class="choices"><button id="delivery" class="choice active">🚚<b>Entrega</b><small>Receba no endereço</small></button><button id="pickup" class="choice">🏪<b>Retirada no local</b><small>Retire seu pedido</small></button></div>
<label>📅 Data do pedido<input id="date" type="date"></label><label id="addressbox">📍 Endereço de entrega<textarea id="address" placeholder="Rua, número, bairro..."></textarea><div class="address-mini"><input id="building" placeholder="Prédio"><input id="block" placeholder="Bloco"><input id="apartment" placeholder="Apartamento"></div></label><label>📝 Observação geral<textarea id="general" placeholder="Ex.: se não tiver algum item, pode substituir..."></textarea></label><button id="send" class="send">Finalizar pedido no WhatsApp →</button></div>
</section></main>
<nav class="bottom"><button id="nav-home">⌂<span>Início</span></button><button id="nav-cats">▦<span>Categorias</span></button><button id="nav-bag">🛒<span>Sacola <em id="navcount">0</em></span></button><button id="nav-more">☰<span>Mais</span></button></nav>
<div id="modal" class="modal"><div class="shade"></div><div class="modalbox"><button id="close">×</button><small>ALTERAR ITEM</small><h3 id="mname"></h3><label>Unidade<select id="munit"></select></label><div class="mqty"><button id="mminus">−</button><input id="mqty" type="number" min="0"><button id="mplus">+</button></div><button id="msave" class="send">Salvar alteração</button></div></div><div id="toast"></div><script type="module" src="./preview.js?v=10"></script></body></html>
